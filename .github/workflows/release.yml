# Release automatizada a partir dos Conventional Commits (ADR-0005).
name: Release

on:
  push:
    branches: [main]

# `shell: bash` ativa -o pipefail (o padrão do runner não ativa).
defaults:
  run:
    shell: bash

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: 🏷️ release-please
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          # PAT do próprio autor mantém a autoria única e dispara os checks no Release PR.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
